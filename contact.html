<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact page for Giselle Mendoza's personal site">
  <script>
    {
      try {
        const t = localStorage.getItem("theme-preference");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch { }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <title>Contact | My Portfolio</title>
  <link rel="stylesheet" href="winter.css">
  <link rel="stylesheet" href="winterContact.css">
  <noscript>
    <style>
    header nav { display: block !important; position: static !important; }
    .menu-toggle { display: none !important; }
    </style>
  </noscript>
</head>

<body>
  <header>
    <img src="butterf.png" alt="butterfly for logo" width="150" height="150">
    <!-- js -->
    <button class="menu-toggle" aria-label="Open navigation menu">
      ☰
    </button>
    
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="experience.html">Experience</a></li>
        <li><a href="experiments.html">Experiments</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    
    <fieldset id="theme-picker" hidden>
      <legend>Theme</legend>
      <div>
        <button type="button" value="light" aria-pressed="false">Light</button>
        <button type="button" value="dark" aria-pressed="false">Dark</button>
        <button type="button" value="auto" aria-pressed="false">Auto</button>
      </div>
    </fieldset>
    </header>

  <main>
    <section id="contact">
      <h1>Contact Me</h1>
      <ul class="contact-links">
        <li><a href="mailto:g1mendoza@ucsd.edu">School Email</a></li>
        <li><a href="mailto:gis.mendoza04@gmail.com">Personal Email</a></li>
        <li><a href="https://linkedin.com/in/giselle-mendoza">LinkedIn</a></li>
        <li><a href="https://github.com/g1mendoza">GitHub</a></li>
      </ul>

      <form action="#" method="post">
        <fieldset>
          <legend>Send Me a Message!!!</legend>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name"><br>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@domain.com"><br><br>

          <label for="message">Message</label><br>
          <textarea id="message" name="message" rows="8" cols="50" placeholder="Write your message here..."></textarea>

          <progress value="0" max="3"></progress>
          <button type="submit">Submit</button>
        </fieldset>
      </form>

      <dialog>
        <p>Thanks for reaching out!</p>
        <button type="button">Close</button>
      </dialog>
    </section>
  </main>

  <footer>
    <nav>
      <ul>
        <li><a href="https://linkedin.com/in/giselle-mendoza">LinkedIn</a></li>
        <li><a href="mailto:g1mendoza@ucsd.edu">Email</a></li>
      </ul>
    </nav>
    <p>&copy; 2026 Giselle Mendoza.</p>
  </footer>
  <script src="jas.js"></script>
  <script type="module" src="theme.js"></script>
</body>
</html>
